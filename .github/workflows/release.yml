# SPDX-License-Identifier: Apache-2.0
# Part of mirrortest -- bidirectional C++ test/code generator.
#
# A release (docs/design.md, section 20; docs/development.md, "Making a release"):
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# builds the program for Linux, macOS and Windows, packs each with CPack, checks the packages, and publishes them with a
# SHA256SUMS file and a build provenance attestation as a GitHub release. The tag must be v + the version of
# CMakeLists.txt, and on main. Nothing is published by a pull request or by a manual run: they build and check the
# packages and keep them as artifacts of the run, which is how this file is tried.
#
# The actions are pinned by commit (the tag is in the comment); Dependabot proposes the updates (.github/dependabot.yml).

name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The version, and for a tag that it is the project's and that the tag is on main.
  check:
    name: version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: v
        run: |
          set -euo pipefail
          version=$(sed -n 's/^project(mirrortest VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt)
          [ -n "$version" ] || { echo "::error::no version in CMakeLists.txt"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::the tag $GITHUB_REF_NAME is not v$version, the version of CMakeLists.txt"; exit 1; }
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::the tag $GITHUB_REF_NAME is not on main"; exit 1; }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in 0.*) pre=true ;; *) pre=false ;; esac
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.os }}
    # Linux is built in the oldest supported environment (glibc 2.35), so that the program runs on later releases of Ubuntu and Debian.
    container: ${{ matrix.container }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04, container: 'ubuntu:22.04' }
          - { name: macos-universal, os: macos-latest, container: '' }
          - { name: windows-x86_64, os: windows-latest, container: '' }
    env:
      VERSION: ${{ needs.check.outputs.version }}
      PACKAGE: mirrortest-${{ needs.check.outputs.version }}-${{ matrix.name }}
    steps:
      - name: Install build tools (Linux)
        if: matrix.name == 'linux-x86_64'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential cmake ninja-build git ca-certificates

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Release, no tests (they ran on the commit), the C++ runtime inside the program.
      - name: Build (Linux)
        if: matrix.name == 'linux-x86_64'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMT_BUILD_TESTS=OFF \
                "-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc"
          cmake --build build -j
          (cd build && cpack -G TGZ -D CPACK_PACKAGE_FILE_NAME="$PACKAGE")

      # One binary for arm64 and x86-64; macOS 11 is the oldest that runs on arm64.
      - name: Build (macOS)
        if: matrix.name == 'macos-universal'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMT_BUILD_TESTS=OFF \
                "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build -j 4
          (cd build && cpack -G TGZ -D CPACK_PACKAGE_FILE_NAME="$PACKAGE")

      # The MSVC runtime inside the program, so that it needs no redistributable.
      - name: Build (Windows)
        if: matrix.name == 'windows-x86_64'
        run: |
          cmake -S . -B build -A x64 -DMT_BUILD_TESTS=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build build --config Release -j
          cd build
          cpack -C Release -G ZIP -D CPACK_PACKAGE_FILE_NAME="$env:PACKAGE"

      # The package, as a user gets it: unpacked, it runs, says the version of the tag, and is a complete install.
      - name: Check the package (Linux, macOS)
        if: matrix.name != 'windows-x86_64'
        run: |
          mkdir unpacked
          tar -xzf "build/$PACKAGE.tar.gz" -C unpacked
          test -d "unpacked/$PACKAGE"
          "unpacked/$PACKAGE/bin/mirrortest" --version | tee version.txt
          grep -Fx "mirrortest $VERSION" version.txt
          tools/check_install.sh "unpacked/$PACKAGE" build
          if [ "$RUNNER_OS" = macOS ]; then
            archs=$(lipo -archs "unpacked/$PACKAGE/bin/mirrortest")
            echo "architectures: $archs"
            case "$archs" in *arm64*x86_64* | *x86_64*arm64*) ;; *) echo "::error::not a universal binary: $archs"; exit 1 ;; esac
          else
            ldd "unpacked/$PACKAGE/bin/mirrortest"
            if ldd "unpacked/$PACKAGE/bin/mirrortest" | grep -q libstdc++; then
              echo "::error::the program needs the C++ runtime of the machine"; exit 1
            fi
          fi

      - name: Check the package (Windows)
        if: matrix.name == 'windows-x86_64'
        run: |
          Expand-Archive -Path "build/$env:PACKAGE.zip" -DestinationPath unpacked
          $exe = "unpacked/$env:PACKAGE/bin/mirrortest.exe"
          if (-not (Test-Path $exe)) { throw "no $exe in the package" }
          $said = & $exe --version
          Write-Host $said
          if ($said -ne "mirrortest $env:VERSION") { throw "the program says '$said', not 'mirrortest $env:VERSION'" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.name }}
          path: |
            build/${{ env.PACKAGE }}.tar.gz
            build/${{ env.PACKAGE }}.zip
          if-no-files-found: error
          retention-days: 14

  # Only for a tag. It does not build: it receives the packages, sums them, attests them and creates the release as a draft
  # that is published when everything is attached, so that a failure leaves no half release; or, if the release exists already
  # (made on the web), attaches the packages to it.
  publish:
    name: publish
    needs: [check, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    # An environment, so that the repository can put a gate in front of the publication (required reviewers) without
    # touching this file; without one set up it is only a name.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      - name: SHA256SUMS
        working-directory: dist
        run: |
          ls -l
          sha256sum mirrortest-* | tee SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/mirrortest-*

      # A release the owner already made on the web (with the title and the notes written by hand) only gets the packages; where
      # there is none, it is created here as a draft and published when everything is attached.
      - name: Attach the packages to the release
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            flags=(--draft --generate-notes --title "mirrortest $VERSION")
            [ "$PRERELEASE" = true ] && flags+=(--prerelease)
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
          fi
