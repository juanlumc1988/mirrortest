# SPDX-License-Identifier: Apache-2.0
# Part of mirrortest -- bidirectional C++ test/code generator.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, RelWithDebInfo]
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: |
          cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                -DMT_WERROR=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The configuration reader without YAML: a .yaml file is refused with a clear error and what needs
  # YAML skips itself, so a build that leaves yaml-cpp out is a build that works.
  no-yaml:
    name: without yaml-cpp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DMT_WERROR=ON \
                -DMT_WITH_YAML=OFF

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The libclang frontend (--frontend libclang): the same models as tree-sitter's, from the same headers, and every
  # gen-tests and gen-impl golden case run again with it, against every libclang that Ubuntu 24.04 offers, from the
  # oldest the code is expected to read to the newest. What libclang puts in the extent of a declaration, the kind of
  # `extern "C" { }` and the name of a typedef'd anonymous struct change from one version to the next, and the one
  # that is tried by hand is not the one that is installed on somebody else's machine. The runner is pinned to the
  # release, because the versions that apt offers are the ones of a release (cmake/MtLibclang.cmake looks for 14 to 21).
  libclang:
    name: libclang ${{ matrix.llvm }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        llvm: [14, 15, 16, 17, 18, 19, 20]
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and libclang ${{ matrix.llvm }}
        run: sudo apt-get update && sudo apt-get install -y ninja-build libclang-${{ matrix.llvm }}-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DMT_WERROR=ON \
                -DMT_WITH_LIBCLANG=ON \
                -DMT_LIBCLANG_INCLUDE_DIR=/usr/lib/llvm-${{ matrix.llvm }}/include \
                -DMT_LIBCLANG_LIBRARY=/usr/lib/llvm-${{ matrix.llvm }}/lib/libclang-${{ matrix.llvm }}.so

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: asan + ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: |
          cmake -S . -B build-san -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DMT_WERROR=ON \
                -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
                -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"

      - name: Build
        run: cmake --build build-san -j

      - name: Test
        env:
          UBSAN_OPTIONS: print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build-san --output-on-failure

  qt:
    name: qt ${{ matrix.qt }} round trips
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - qt: 6
            packages: qt6-base-dev
          - qt: 5
            packages: qtbase5-dev
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and Qt ${{ matrix.qt }}
        run: sudo apt-get update && sudo apt-get install -y ninja-build ${{ matrix.packages }}

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DMT_WERROR=ON

      - name: Build
        run: cmake --build build -j

      # Both directions: gen-tests skeletons compiled against the real API and red
      # (or skipped), gen-impl stubs that make a Qt test compile and fail. A job
      # that finds no Qt registers no such test, and --no-tests=error turns that
      # into a failure instead of a green run that checked nothing.
      - name: Qt Test round trips
        run: ctest --test-dir build -R '^roundtrip\.qt\.' --no-tests=error --output-on-failure

  cross:
    name: cross stubs (32-bit syntax check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and a 32-bit cross compiler
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-arm-linux-gnueabihf

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DMT_WERROR=ON \
                -DMT_CROSS_CXX=arm-linux-gnueabihf-g++

      - name: Build
        run: cmake --build build -j

      # Every generated stub, as C++11 with -Wall -Wextra -Wpedantic -Werror (and
      # -fno-exceptions -fno-rtti under --no-exceptions), by a compiler for a
      # 32-bit target, where `long` and `size_t` are narrower than on the host. The
      # host jobs run the same checks with the host compiler and also link and run
      # the round trips.
      - name: Compile the generated stubs for a 32-bit target
        run: ctest --test-dir build -R '^stubs\.cross\.' --output-on-failure
