# SPDX-License-Identifier: Apache-2.0
# Part of mirrortest -- bidirectional C++ test/code generator.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, RelWithDebInfo]
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: |
          cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                -DMT_WERROR=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The configuration reader without YAML: a .yaml file is refused with a clear error and what needs
  # YAML skips itself, so a build that leaves yaml-cpp out is a build that works.
  no-yaml:
    name: without yaml-cpp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DMT_WERROR=ON \
                -DMT_WITH_YAML=OFF

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The libclang frontend (--frontend libclang): the same models as tree-sitter's, from the same headers, and every
  # gen-tests and gen-impl golden case run again with it, against every libclang that the two Ubuntu LTS releases
  # offer, from the oldest the code is expected to read to the newest. What libclang puts in the extent of a declaration,
  # the kind of `extern "C" { }` and the name of a typedef'd anonymous struct change from one version to the next, and the
  # one that is tried by hand is not the one that is installed on somebody else's machine. The runners are pinned to
  # the release, because the versions that apt offers are the ones of a release: 14 to 20 are in 24.04, 17 to 22 in
  # 26.04 (cmake/MtLibclang.cmake looks for 14 to 22).
  libclang:
    name: libclang ${{ matrix.llvm }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { llvm: 14, os: ubuntu-24.04 }
          - { llvm: 15, os: ubuntu-24.04 }
          - { llvm: 16, os: ubuntu-24.04 }
          - { llvm: 17, os: ubuntu-24.04 }
          - { llvm: 18, os: ubuntu-24.04 }
          - { llvm: 19, os: ubuntu-24.04 }
          - { llvm: 20, os: ubuntu-24.04 }
          - { llvm: 21, os: ubuntu-26.04 }
          - { llvm: 22, os: ubuntu-26.04 }
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and libclang ${{ matrix.llvm }}
        run: sudo apt-get update && sudo apt-get install -y ninja-build libclang-${{ matrix.llvm }}-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DMT_WERROR=ON \
                -DMT_WITH_LIBCLANG=ON \
                -DMT_LIBCLANG_INCLUDE_DIR=/usr/lib/llvm-${{ matrix.llvm }}/include \
                -DMT_LIBCLANG_LIBRARY=/usr/lib/llvm-${{ matrix.llvm }}/lib/libclang-${{ matrix.llvm }}.so

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The newest toolchains that Ubuntu ships (26.04 LTS: GCC 15, Clang 22, CMake 4): what breaks with them is what breaks on
  # a user's machine within a year. A missing `#include <algorithm>`, which the standard library of GCC 14 gave for free
  # and GCC 15's does not, was the first.
  newest:
    name: ${{ matrix.compiler }} on ubuntu 26.04
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ${{ matrix.compiler == 'clang' && 'clang-22' || 'g++' }}

      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang-22' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++-22' }}
        run: |
          cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DMT_WERROR=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Installing it (plan 9.8): `cmake --install` leaves a tree in which the program runs and says its version, the
  # documentation is there with its links, and no file holds the path of the build or of the source; and the package CPack
  # makes from it is the same tree. Nothing is published: a release is the owner's decision.
  install:
    name: install and package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMT_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build -j

      - name: Install, run it, check the tree
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/mirrortest"
          "$RUNNER_TEMP/mirrortest/bin/mirrortest" --version
          tools/check_install.sh "$RUNNER_TEMP/mirrortest" build

      - name: Package (TGZ), unpack it, check it
        run: |
          (cd build && cpack -G TGZ)
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf build/mirrortest-*.tar.gz -C "$RUNNER_TEMP/unpacked"
          tools/check_install.sh "$RUNNER_TEMP"/unpacked/mirrortest-* build

  sanitizers:
    name: asan + ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: |
          cmake -S . -B build-san -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DMT_WERROR=ON \
                -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
                -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"

      - name: Build
        run: cmake --build build-san -j

      - name: Test
        env:
          UBSAN_OPTIONS: print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build-san --output-on-failure

  qt:
    name: qt ${{ matrix.qt }} round trips
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - qt: 6
            packages: qt6-base-dev
          - qt: 5
            packages: qtbase5-dev
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and Qt ${{ matrix.qt }}
        run: sudo apt-get update && sudo apt-get install -y ninja-build ${{ matrix.packages }}

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DMT_WERROR=ON

      - name: Build
        run: cmake --build build -j

      # Both directions: gen-tests skeletons compiled against the real API and red
      # (or skipped), gen-impl stubs that make a Qt test compile and fail. A job
      # that finds no Qt registers no such test, and --no-tests=error turns that
      # into a failure instead of a green run that checked nothing.
      - name: Qt Test round trips
        run: ctest --test-dir build -R '^roundtrip\.qt\.' --no-tests=error --output-on-failure

  cross:
    name: cross stubs (32-bit syntax check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and a 32-bit cross compiler
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-arm-linux-gnueabihf

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DMT_WERROR=ON \
                -DMT_CROSS_CXX=arm-linux-gnueabihf-g++

      - name: Build
        run: cmake --build build -j

      # Every generated stub, as C++11 with -Wall -Wextra -Wpedantic -Werror (and
      # -fno-exceptions -fno-rtti under --no-exceptions), by a compiler for a
      # 32-bit target, where `long` and `size_t` are narrower than on the host. The
      # host jobs run the same checks with the host compiler and also link and run
      # the round trips.
      - name: Compile the generated stubs for a 32-bit target
        run: ctest --test-dir build -R '^stubs\.cross\.' --output-on-failure

  # The one check that branch protection requires: it passes only if every job above passed, so the rule does not have to
  # list them, and a renamed job or a new entry in a matrix needs no change to it. `always()` makes it run (and fail)
  # when a job failed or was cancelled, instead of being skipped, which a required check would count as passed.
  ci-ok:
    name: ci passed
    if: always()
    needs: [host, no-yaml, libclang, newest, install, sanitizers, qt, cross]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "a job ended as '$r'"; exit 1; }
          done
