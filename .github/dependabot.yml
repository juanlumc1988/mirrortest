# Part of mirrortest -- bidirectional C++ test/code generator.
#
# The actions of the workflows (ci.yml by tag, release.yml by commit with the tag in a comment): Dependabot proposes the
# update of all of them as one pull request a month, which CI checks before anybody merges it. It waits a week after a version
# comes out before proposing it, which is when a compromised release is usually pulled. Security updates are a different
# setting (Settings, Code security) and do not wait for either.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: "CI:"
    groups:
      actions:
        patterns: ['*']
