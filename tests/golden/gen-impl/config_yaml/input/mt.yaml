# The house style, as a person would write it.
default_namespace: acme
guard: pragma-once
file_header: |
  // Copyright (c) ACME. All rights reserved.
stub_policy: abort
naming:
  header: "{stem}.hpp"
  source: "{stem}.cc"
# Two accessors that answer alike: said once, and merged into the second.
overrides:
  acme::Foo::size: &accessor { returns: unsigned int, const: true }
  acme::Foo::length: { <<: *accessor }
